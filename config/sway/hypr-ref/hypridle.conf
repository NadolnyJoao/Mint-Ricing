# Idle daemon config for Omarchy.
#
# Após 5 minutos ocioso a tela desliga, sem bloquear a sessão
# (nenhuma senha é pedida ao voltar).
#
# Fechar a tampa continua bloqueando a sessão imediatamente através do
# binding "switch:on:Lid Switch" do Omarchy (omarchy-system-lid-close),
# e o logind suspende a máquina. Ao retomar, a senha é pedida.
#
# O bloqueio automático do Omarchy (idle.lock em ~/.config/omarchy/shell.json)
# fica desativado para não duplicar essa configuração.

general {
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    inhibit_sleep = false
}

listener {
    timeout = 300
    # Respeita o "Stay Awake" do Omarchy (SUPER + CTRL + I).
    on-timeout = test -f "$HOME/.local/state/omarchy/indicators/stay-awake" || hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}
